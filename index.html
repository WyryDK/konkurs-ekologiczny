<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<title>Konkurs</title>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js"></script>
</head>
<body>

<div id="start">
<input id="name" maxlength="10" placeholder="Imię">
<input id="surname" maxlength="16" placeholder="Nazwisko"><br><br>
<input id="email" type="email" maxlength="32" placeholder="Email">

<div class="cf-turnstile" data-sitekey="YOUR_SITE_KEY"></div>

<button onclick="start()">Rozpocznij</button>
</div>

<div id="quiz" style="display:none"></div>

<script>
let token=null
let answers=[]

async function start(){
  const res=await fetch('/api/start',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      name:document.getElementById('name').value,
      surname:document.getElementById('surname').value,
      email:document.getElementById('email').value,
      captcha:turnstile.getResponse()
    })
  })
  const data=await res.json()
  if(!data.token){alert(data.error);return}
  token=data.token
  document.getElementById('start').style.display='none'
  document.getElementById('quiz').style.display='block'
  render(data.questions)
}

function render(qs){
  let html=''
  qs.forEach((q,i)=>{
    html+=`<div>${q.q}<br>`
    q.a.forEach((a,j)=>{
      html+=`<label><input type="radio" name="q${i}" value="${j}">${a}</label><br>`
    })
    html+='</div>'
  })
  html+=`<button onclick="submitQuiz()">Wyślij</button>`
  document.getElementById('quiz').innerHTML=html
}

async function submitQuiz(){
  answers=[]
  for(let i=0;i<5;i++){
    answers.push(document.querySelector(`input[name="q${i}"]:checked`)?.value)
  }

  const res=await fetch('/api/submit',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({token,answers})
  })

  const data=await res.json()
  alert(`Wynik: ${data.score}/5 | Czas: ${data.time}s`)
}
</script>

</body>
</html>
