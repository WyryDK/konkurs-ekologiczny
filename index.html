<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Konkurs</title>
  <style>
    body { font-family: Arial; max-width: 600px; margin: 40px auto; }
    .hidden { display: none; }
    button { margin-top: 20px; }
    #result { margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>

<h1>Konkurs</h1>
<p><b>Konkurs trwa od 8 kwietnia 2026 do 24 czerwca 2026</b></p>

<div id="form-user">
  <h3>Dane uczestnika</h3>
  <input type="text" id="name" placeholder="Imię" required><br><br>
  <input type="text" id="surname" placeholder="Nazwisko" required><br><br>
  <input type="email" id="email" placeholder="Email" required><br><br>

  <label>
    <input type="checkbox" id="rodo" required>
    Akceptuję <a href="/konkurs-ekologiczny/RODO.html" target="_blank">RODO</a>
  </label><br>

  <label>
    <input type="checkbox" id="rules" required>
    Akceptuję <a href="/konkurs-ekologiczny/regulamin.html" target="_blank">regulamin konkursu</a>
  </label><br><br>

  <button onclick="startQuiz()">Rozpocznij</button>
</div>

<div id="quiz" class="hidden">
  <h3>Quiz</h3>
  <form id="quizForm"></form>
  <button onclick="submitQuiz()">Wyślij</button>
</div>

<div id="result" class="hidden"></div>

<script>
let startTime;

// BLOKADA WIELOKROTNEGO UDZIAŁU
if (localStorage.getItem('quizDone')) {
  document.body.innerHTML = '<h2>Już brałeś udział w konkursie.</h2>';
}

// DATY KONKURSU
const now = new Date();
const startDate = new Date('2026-04-08T00:00:00');
const endDate = new Date('2026-06-24T23:59:59');

if (now < startDate) {
  document.body.innerHTML = '<h2>Konkurs rozpocznie się w dniu 8.04.2026</h2>';
} else if (now > endDate) {
  document.body.innerHTML = '<h2>Konkurs zakończył się w dniu 24.06.2026</h2>';
}

const questions = [
  { question: "Pytanie 1", answers: ["Odpowiedź A","Odpowiedź B","Odpowiedź C"] },
  { question: "Pytanie 2", answers: ["Odpowiedź A","Odpowiedź B","Odpowiedź C"] },
  { question: "Pytanie 3", answers: ["Odpowiedź A","Odpowiedź B","Odpowiedź C"] },
  { question: "Pytanie 4", answers: ["Odpowiedź A","Odpowiedź B","Odpowiedź C"] },
  { question: "Pytanie 5", answers: ["Odpowiedź A","Odpowiedź B","Odpowiedź C"] }
];

function startQuiz() {
  const name = document.getElementById('name').value;
  const surname = document.getElementById('surname').value;
  const email = document.getElementById('email').value;
  const rodo = document.getElementById('rodo').checked;
  const rules = document.getElementById('rules').checked;

  if (!name || !surname || !email || !rodo || !rules) {
    alert('Wypełnij wszystkie pola i zaakceptuj zgody');
    return;
  }

  document.getElementById('form-user').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');

  startTime = performance.now();
  renderQuestions();
}

function renderQuestions() {
  const form = document.getElementById('quizForm');
  form.innerHTML = '';

  questions.forEach((q, i) => {
    const div = document.createElement('div');
    div.innerHTML = `<p>${i+1}. ${q.question}</p>` +
      q.answers.map((a) =>
        `<label><input type="radio" name="q${i}" value="${a}" required> ${a}</label><br>`
      ).join('');

    form.appendChild(div);
  });
}

function submitQuiz() {
  const endTime = performance.now();
  const duration = ((endTime - startTime) / 1000).toFixed(2);

  const formData = new FormData(document.getElementById('quizForm'));

  for (let i = 0; i < questions.length; i++) {
    if (!formData.get('q' + i)) {
      alert('Odpowiedz na wszystkie pytania');
      return;
    }
  }

  localStorage.setItem('quizDone', 'true');

  document.getElementById('quiz').classList.add('hidden');
  const resultDiv = document.getElementById('result');
  resultDiv.classList.remove('hidden');
  resultDiv.innerHTML = `Dziękujemy za udział!<br>Czas rozwiązania: <b>${duration} sekund</b>`;
}
</script>

</body>
</html>
