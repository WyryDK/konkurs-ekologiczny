<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>Konkurs Ekologiczny 2026</title>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js"></script>
</head>

<body>

<h2>Konkurs Ekologiczny</h2>

<p>
Termin: <b>08.04.2026 – 24.06.2026</b>
</p>

<p>
<a href="/konkurs-ekologiczny/regulamin.html" target="_blank">Regulamin</a> |
<a href="/konkurs-ekologiczny/RODO.html" target="_blank">RODO</a>
</p>

<hr>

<div id="start">

<input id="name" maxlength="10" placeholder="Imię"><br>
<input id="surname" maxlength="20" placeholder="Nazwisko"><br>
<input id="email" type="email" maxlength="32" placeholder="Email"><br><br>

<label>
<input type="checkbox" id="reg">
Akceptuję regulamin
</label><br>

<label>
<input type="checkbox" id="rodo">
Akceptuję RODO
</label><br><br>

<div id="turnstile"></div>
  
<button onclick="start()">Rozpocznij</button>

</div>

<div id="quiz" style="display:none"></div>

<script>

let captchaToken = null
let captchaRendered = false
let quizToken = null
let startTime = null

function renderCaptcha(){

  if(captchaRendered) return
  captchaRendered = true

  turnstile.render('#turnstile', {
    sitekey: '0x4AAAAAADNW2v__gciRO1kI',
    callback: function(token){
      captchaToken = token
    }
  })

}

async function start(){

  const name = document.getElementById('name').value.trim()
  const surname = document.getElementById('surname').value.trim()
  const email = document.getElementById('email').value.trim()

  const reg = document.getElementById('reg').checked
  const rodo = document.getElementById('rodo').checked
  const API = 'https://quiz-backend-kt3u.onrender.com'
  const formOpenedAt = Date.now()
  
  if(!name || !surname || !email){
    alert('Uzupełnij dane')
    return
  }

  if(name.length>20 || surname.length>20){
    alert('Max 20 znaków')
    return
  }

  if(!reg || !rodo){
    alert('Wymagane zgody')
    return
  }

  renderCaptcha()

  if(!captchaToken){
    alert('Potwierdź CAPTCHA')
    return
  }

  startTime = Date.now()

  const res = await fetch('${API}/api/start',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      name,
      surname,
      email,
      captcha: captchaToken
    })
  })
  
const text = await res.text()
console.log(text)
  const data = JSON.parse(text)
  
  if(!data.token){
    alert(data.error)
    return
  }

  quizToken = data.token

  document.getElementById('start').style.display='none'
  document.getElementById('quiz').style.display='block'

  renderQuiz(data.questions)
}

function render(qs){

let html=''

qs.forEach((q,i)=>{
html+=`<div><b>${q.q}</b><br>`
q.a.forEach((a,j)=>{
html+=`<label><input type="radio" name="q${i}" value="${j}">${a}</label><br>`
})
html+='</div><br>'
})

html+=`<button onclick="submitQuiz()">Wyślij</button>`
document.getElementById('quiz').innerHTML=html
}

async function submitQuiz(){
answers=[]
for(let i=0;i<5;i++){
answers.push(
document.querySelector(`input[name="q${i}"]:checked`)?.value
)
}

const res=await fetch('${API}/api/submit',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({token,answers})
})

const data=await res.json()
alert(`Wynik: ${data.score}/5 | Czas: ${data.time}s`)
}

</script>

</body>
</html>
